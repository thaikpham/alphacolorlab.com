<svg viewBox="0 0 720 480" width="720" height="480" xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans, system-ui, sans-serif">
<title>Ba lựa chọn quyết định file gửi đi: kích thước ảnh, định dạng RAW hay JPEG, bản video</title>
<rect width="720" height="480" fill="#ffffff"/>
<text x="360" y="80" text-anchor="middle" font-size="28" font-weight="600" fill="#0b0d12">Ba lựa chọn quyết định file gửi đi</text>
<rect x="32" y="108" width="200" height="80" rx="14" fill="#f3f4f6" stroke="#0b0d12" stroke-width="3"/>
<text x="132" y="156" text-anchor="middle" font-size="28" font-weight="600" fill="#0b0d12">Kích thước</text>
<line x1="232" y1="148" x2="262" y2="148" stroke="#0b0d12" stroke-width="3"/>
<polygon points="262,140 274,148 262,156" fill="#0b0d12"/>
<rect x="278" y="108" width="410" height="80" rx="14" fill="#ffffff" stroke="#0b0d12" stroke-width="3"/>
<text x="483" y="156" text-anchor="middle" font-size="24" fill="#0b0d12">Original hoặc 2M</text>
<rect x="32" y="200" width="200" height="80" rx="14" fill="#f3f4f6" stroke="#0b0d12" stroke-width="3"/>
<text x="132" y="248" text-anchor="middle" font-size="28" font-weight="600" fill="#0b0d12">Định dạng</text>
<line x1="232" y1="240" x2="262" y2="240" stroke="#0b0d12" stroke-width="3"/>
<polygon points="262,232 274,240 262,248" fill="#0b0d12"/>
<rect x="278" y="200" width="410" height="80" rx="14" fill="#ffffff" stroke="#0b0d12" stroke-width="3"/>
<text x="483" y="248" text-anchor="middle" font-size="24" fill="#0b0d12">JPEG, RAW hoặc cả hai</text>
<rect x="32" y="292" width="200" height="80" rx="14" fill="#f3f4f6" stroke="#0b0d12" stroke-width="3"/>
<text x="132" y="340" text-anchor="middle" font-size="28" font-weight="600" fill="#0b0d12">Video</text>
<line x1="232" y1="332" x2="262" y2="332" stroke="#f05a14" stroke-width="4"/>
<polygon points="262,324 274,332 262,340" fill="#f05a14"/>
<rect x="278" y="292" width="410" height="80" rx="14" fill="#ffffff" stroke="#f05a14" stroke-width="4"/>
<text x="483" y="340" text-anchor="middle" font-size="24" fill="#0b0d12">Proxy, Original hoặc cả hai</text>
<line x1="32" y1="404" x2="688" y2="404" stroke="#e3e6eb" stroke-width="2"/>
<text x="360" y="440" text-anchor="middle" font-size="24" fill="#4a5260">A6400 chọn cỡ ảnh trong PlayMemories Mobile</text>
</svg>
