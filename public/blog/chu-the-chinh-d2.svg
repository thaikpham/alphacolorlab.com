<rect x="40" y="60" width="300" height="300" rx="24" fill="#f3f4f6"/>
<circle cx="130" cy="170" r="34" fill="#4a5260"/>
<rect x="90" y="212" width="80" height="118" rx="24" fill="#4a5260"/>
