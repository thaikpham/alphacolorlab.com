  <rect x="205" y="195" width="140" height="105" rx="8" fill="#f3f4f6" stroke="#0b0d12" stroke-width="2"/>
  <rect x="375" y="221" width="140" height="79" rx="8" fill="#f3f4f6" stroke="#0b0d12" stroke-width="2"/>
  <rect x="545" y="160" width="140" height="140" rx="8" fill="#f3f4f6" stroke="#f05a14" stroke-width="4"/>
