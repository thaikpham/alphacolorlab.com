<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" font-family="Noto Sans, system-ui, sans-serif">
<title>Phím Tracking On đổi cài đặt trong lúc giữ, nhả ra thì trở về cũ</title>
<rect width="720" height="480" fill="#ffffff"/>
<rect x="56" y="64" width="608" height="88" rx="14" fill="#f3f4f6"/>
<text x="88" y="116" font-size="28" font-weight="600" fill="#0b0d12">Chưa giữ phím</text>
<text x="352" y="116" font-size="26" fill="#4a5260">Cài đặt cũ</text>
<line x1="120" y1="160" x2="120" y2="182" stroke="#7c8594" stroke-width="4"/>
<polygon points="120,190 108,176 132,176" fill="#7c8594"/>
<rect x="56" y="192" width="608" height="88" rx="14" fill="#f3f4f6" stroke="#f05a14" stroke-width="4"/>
<text x="88" y="244" font-size="28" font-weight="600" fill="#0b0d12">Đang giữ phím</text>
<text x="352" y="224" font-size="26" fill="#0b0d12">AF liên tục</text>
<text x="352" y="262" font-size="26" fill="#0b0d12">Focus Area: Tracking</text>
<line x1="120" y1="288" x2="120" y2="310" stroke="#7c8594" stroke-width="4"/>
<polygon points="120,318 108,302 132,302" fill="#7c8594"/>
<rect x="56" y="320" width="608" height="88" rx="14" fill="#f3f4f6"/>
<text x="88" y="372" font-size="28" font-weight="600" fill="#0b0d12">Nhả phím</text>
<text x="352" y="372" font-size="26" fill="#4a5260">Cài đặt cũ</text>
</svg>
