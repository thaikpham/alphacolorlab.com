<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" font-family="Noto Sans, system-ui, sans-serif">
<title>Thang bù sáng từ −5 đến +5 EV: vùng màn hình hiện từ −3 đến +3 và vùng silhouette từ −1 đến −2</title>
<rect width="720" height="480" fill="#ffffff"/>
<path d="M180 168 V150 H540 V168" fill="none" stroke="#7c8594" stroke-width="3"/>
<text x="360" y="130" text-anchor="middle" font-size="26" font-weight="600" fill="#0b0d12">Màn hình hiện</text>
<line x1="60" y1="250" x2="660" y2="250" stroke="#7c8594" stroke-width="3"/>
<path d="M60 240V260M120 240V260M180 240V260M240 240V260M300 240V260M360 240V260M420 240V260M480 240V260M540 240V260M600 240V260M660 240V260" fill="none" stroke="#7c8594" stroke-width="2"/>
<rect x="240" y="226" width="60" height="48" rx="8" fill="#f05a14"/>
<text x="60" y="300" text-anchor="middle" font-size="24" fill="#4a5260">−5</text>
<text x="180" y="300" text-anchor="middle" font-size="24" fill="#4a5260">−3</text>
<text x="360" y="300" text-anchor="middle" font-size="24" fill="#4a5260">0</text>
<text x="540" y="300" text-anchor="middle" font-size="24" fill="#4a5260">+3</text>
<text x="660" y="300" text-anchor="middle" font-size="24" fill="#4a5260">+5</text>
<path d="M270 274 V330" fill="none" stroke="#7c8594" stroke-width="2"/>
<text x="270" y="356" text-anchor="middle" font-size="26" font-weight="600" fill="#b43f00">Silhouette: −1 đến −2</text>
<text x="360" y="420" text-anchor="middle" font-size="26" font-weight="600" fill="#4a5260">Bù sáng (EV)</text>
</svg>
