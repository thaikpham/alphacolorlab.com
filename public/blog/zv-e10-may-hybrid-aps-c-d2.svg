<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" font-family="Noto Sans, system-ui, sans-serif">
<title>Khoảng cách đủ sáng của Godox iM20 theo năm mức đèn ở ISO 800, khẩu F4</title>
<rect width="720" height="480" fill="#ffffff"/>
<text x="24" y="40" font-size="26" font-weight="700" fill="#0b0d12">ISO 800, khẩu F4: mỗi mức đèn sáng tới đâu</text>
<rect x="110" y="64" width="125" height="296" fill="#f3f4f6"/>
<line x1="235" y1="64" x2="235" y2="384" stroke="#7c8594" stroke-width="2" stroke-dasharray="8 6"/>
<g font-size="24" font-weight="700" fill="#0b0d12">
<text x="24" y="100">1/16</text>
<text x="24" y="160">1/8</text>
<text x="24" y="220">1/4</text>
<text x="24" y="280">1/2</text>
<text x="24" y="340">1/1</text>
</g>
<g fill="#f05a14">
<rect x="110" y="74" width="125" height="36"/>
<rect x="110" y="134" width="175" height="36"/>
<rect x="110" y="194" width="250" height="36"/>
<rect x="110" y="254" width="350" height="36"/>
<rect x="110" y="314" width="500" height="36"/>
</g>
<g font-size="24" fill="#0b0d12">
<text x="247" y="100">1 m</text>
<text x="297" y="160">1,4 m</text>
<text x="372" y="220">2 m</text>
<text x="472" y="280">2,8 m</text>
<text x="622" y="340">4 m</text>
</g>
<line x1="110" y1="384" x2="640" y2="384" stroke="#4a5260" stroke-width="2"/>
<g stroke="#4a5260" stroke-width="2">
<line x1="110" y1="384" x2="110" y2="394"/>
<line x1="235" y1="384" x2="235" y2="394"/>
<line x1="360" y1="384" x2="360" y2="394"/>
<line x1="485" y1="384" x2="485" y2="394"/>
<line x1="610" y1="384" x2="610" y2="394"/>
</g>
<g font-size="24" fill="#4a5260" text-anchor="middle">
<text x="110" y="424">0</text>
<text x="235" y="424">1 m</text>
<text x="360" y="424">2 m</text>
<text x="485" y="424">3 m</text>
<text x="610" y="424">4 m</text>
</g>
<text x="24" y="466" font-size="24" fill="#b43f00">Tăng một mức đèn: xa thêm 1,4 lần</text>
</svg>
