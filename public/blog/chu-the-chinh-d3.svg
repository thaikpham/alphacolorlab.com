<text x="288" y="96" font-family="Noto Sans, system-ui, sans-serif" font-size="28" font-weight="600" fill="#0b0d12">Đảo mép khung</text>
<text x="288" y="134" font-family="Noto Sans, system-ui, sans-serif" font-size="24" fill="#4a5260">Bỏ vật ở mép</text>
<text x="288" y="242" font-family="Noto Sans, system-ui, sans-serif" font-size="28" font-weight="600" fill="#0b0d12">Đổi góc, lại gần</text>
