<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" font-family="Noto Sans, system-ui, sans-serif">
<title>Nhiều nguồn sáng: đo theo đèn chính, nguồn phụ thành màu không khí</title>
<rect width="720" height="480" fill="#ffffff"/>
<text x="360" y="60" text-anchor="middle" font-size="30" font-weight="600" fill="#0b0d12">Chọn một nguồn làm chuẩn</text>
<rect x="40" y="100" width="280" height="110" rx="14" fill="#ffffff" stroke="#f05a14" stroke-width="3"/>
<text x="180" y="146" text-anchor="middle" font-size="30" font-weight="600" fill="#b43f00">Đèn vàng</text>
<text x="180" y="186" text-anchor="middle" font-size="24" fill="#4a5260">Chọn làm chuẩn</text>
<rect x="400" y="100" width="280" height="110" rx="14" fill="#f3f4f6" stroke="#7c8594" stroke-width="2"/>
<text x="540" y="146" text-anchor="middle" font-size="30" font-weight="600" fill="#0b0d12">Cửa sổ</text>
<text x="540" y="186" text-anchor="middle" font-size="24" fill="#4a5260">Thành màu không khí</text>
<path d="M260 210 V316" fill="none" stroke="#0b0d12" stroke-width="3"/>
<polygon points="260,330 252,316 268,316" fill="#0b0d12"/>
<rect x="160" y="330" width="400" height="100" rx="14" fill="#ffffff" stroke="#0b0d12" stroke-width="3"/>
<text x="360" y="372" text-anchor="middle" font-size="30" font-weight="600" fill="#0b0d12">Mặt người</text>
<text x="360" y="410" text-anchor="middle" font-size="24" fill="#4a5260">Da gần trung tính</text>
</svg>
