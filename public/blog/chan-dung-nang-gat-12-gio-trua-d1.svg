<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" font-family="Noto Sans, system-ui, sans-serif">
<title>Bóng râm mở: tường chắn nắng và bầu trời làm nguồn sáng mềm</title>
<rect width="720" height="480" fill="#ffffff"/>
<rect x="40" y="300" width="250" height="80" fill="#e3e6eb"/>
<rect x="330" y="300" width="350" height="80" fill="#f3f4f6"/>
<line x1="40" y1="380" x2="680" y2="380" stroke="#7c8594" stroke-width="3"/>
<rect x="300" y="130" width="24" height="250" fill="#4a5260"/>
<text x="312" y="116" text-anchor="middle" font-size="24" font-weight="600" fill="#4a5260">Tường</text>
<circle cx="600" cy="90" r="34" fill="#f05a14"/>
<text x="600" y="44" text-anchor="middle" font-size="24" font-weight="600" fill="#4a5260">Mặt trời</text>
<line x1="575" y1="118" x2="500" y2="290" stroke="#7c8594" stroke-width="3" stroke-dasharray="10 8"/>
<line x1="612" y1="124" x2="598" y2="290" stroke="#7c8594" stroke-width="3" stroke-dasharray="10 8"/>
<text x="500" y="350" text-anchor="middle" font-size="26" font-weight="600" fill="#0b0d12">Nắng gắt</text>
<line x1="80" y1="150" x2="80" y2="256" stroke="#7c8594" stroke-width="4" stroke-dasharray="10 8"/>
<polygon points="80,264 70,248 90,248" fill="#7c8594"/>
<line x1="130" y1="150" x2="130" y2="256" stroke="#7c8594" stroke-width="4" stroke-dasharray="10 8"/>
<polygon points="130,264 120,248 140,248" fill="#7c8594"/>
<text x="40" y="128" font-size="24" font-weight="600" fill="#4a5260">Bầu trời mở</text>
<circle cx="190" cy="250" r="28" fill="#0b0d12"/>
<rect x="168" y="284" width="44" height="96" rx="20" fill="#4a5260"/>
<text x="96" y="352" text-anchor="middle" font-size="26" font-weight="600" fill="#0b0d12">Bóng râm</text>
<text x="190" y="440" text-anchor="middle" font-size="24" font-weight="600" fill="#0b0d12">Chủ thể</text>
</svg>
