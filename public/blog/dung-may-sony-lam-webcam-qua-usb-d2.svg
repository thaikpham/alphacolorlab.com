<svg viewBox="0 0 720 480" width="720" height="480" xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans, system-ui, sans-serif">
<title>Ba trạng thái USB Streaming trên ZV-E10: Not Connect, Standby, Output</title>
<rect width="720" height="480" fill="#ffffff"/>
<text x="360" y="80" text-anchor="middle" font-size="28" font-weight="600" fill="#0b0d12">USB Streaming trên ZV-E10</text>
<text x="243" y="160" text-anchor="middle" font-size="24" fill="#4a5260">Cắm cáp</text>
<text x="476" y="160" text-anchor="middle" font-size="24" fill="#4a5260">Bắt đầu stream</text>
<rect x="32" y="170" width="190" height="130" rx="14" fill="#f3f4f6" stroke="#0b0d12" stroke-width="3"/>
<text x="127" y="243" text-anchor="middle" font-size="26" font-weight="600" fill="#0b0d12">Not Connect</text>
<rect x="265" y="170" width="190" height="130" rx="14" fill="#f3f4f6" stroke="#0b0d12" stroke-width="3"/>
<text x="360" y="243" text-anchor="middle" font-size="26" font-weight="600" fill="#0b0d12">Standby</text>
