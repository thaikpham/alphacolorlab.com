<text x="593" y="243" text-anchor="middle" font-size="26" font-weight="600" fill="#0b0d12">Output</text>
<line x1="228" y1="235" x2="252" y2="235" stroke="#0b0d12" stroke-width="3"/>
<polygon points="252,226 262,235 252,244" fill="#0b0d12"/>
<line x1="461" y1="235" x2="485" y2="235" stroke="#0b0d12" stroke-width="3"/>
<polygon points="485,226 495,235 485,244" fill="#0b0d12"/>
<line x1="32" y1="342" x2="688" y2="342" stroke="#e3e6eb" stroke-width="2"/>
<text x="360" y="392" text-anchor="middle" font-size="24" fill="#4a5260">Thoát: nút Still/Movie/S&amp;Q hoặc nút giữa bánh xe</text>
</svg>
