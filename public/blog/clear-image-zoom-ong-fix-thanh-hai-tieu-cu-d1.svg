<svg viewBox="0 0 720 480" width="720" height="480" xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans, system-ui, sans-serif">
<title>Hệ số zoom của ZV-E10 ở ảnh M 12M theo ba cách zoom</title>
<rect width="720" height="480" fill="#ffffff"/>
<text x="48" y="72" font-size="30" font-weight="600" fill="#0b0d12">ZV-E10, ảnh M 12M</text>
<text x="48" y="124" font-size="26" font-weight="600" fill="#0b0d12">Zoom quang học</text>
<rect x="48" y="136" width="123" height="44" rx="8" fill="#7c8594"/>
<text x="187" y="168" font-size="30" font-weight="600" fill="#0b0d12">1,4×</text>
<text x="48" y="216" font-size="26" font-weight="600" fill="#0b0d12">Zoom rõ nét</text>
<rect x="48" y="228" width="246" height="44" rx="8" fill="#f05a14"/>
<text x="310" y="260" font-size="30" font-weight="600" fill="#b43f00">2,8×</text>
<text x="48" y="308" font-size="26" font-weight="600" fill="#0b0d12">Zoom số</text>
<rect x="48" y="320" width="500" height="44" rx="8" fill="#7c8594"/>
<text x="564" y="352" font-size="30" font-weight="600" fill="#0b0d12">5,7×</text>
<text x="48" y="424" font-size="24" fill="#4a5260">Aspect Ratio 3:2. Ảnh M có smart zoom.</text>
</svg>
