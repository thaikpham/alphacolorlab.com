<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" font-family="Noto Sans, system-ui, sans-serif">
<title>Ba lựa chọn File Format: RAW, RAW và JPEG, JPEG</title>
<rect width="720" height="480" fill="#ffffff"/>
<rect x="32" y="90" width="200" height="340" rx="14" fill="#ffffff" stroke="#7c8594" stroke-width="2"/>
<text x="132" y="140" text-anchor="middle" font-size="26" font-weight="600" fill="#0b0d12">RAW</text>
<rect x="52" y="190" width="160" height="100" rx="8" fill="#f3f4f6" stroke="#0b0d12" stroke-width="2"/>
<text x="132" y="249" text-anchor="middle" font-size="26" font-weight="600" fill="#0b0d12">RAW</text>
<rect x="260" y="90" width="200" height="340" rx="14" fill="#ffffff" stroke="#f05a14" stroke-width="3"/>
