<text x="360" y="339" text-anchor="middle" font-size="26" font-weight="600" fill="#0b0d12">JPEG</text>
<rect x="488" y="90" width="200" height="340" rx="14" fill="#ffffff" stroke="#7c8594" stroke-width="2"/>
<text x="588" y="140" text-anchor="middle" font-size="26" font-weight="600" fill="#0b0d12">JPEG</text>
<rect x="508" y="190" width="160" height="100" rx="8" fill="#f3f4f6" stroke="#0b0d12" stroke-width="2"/>
