<svg viewBox="0 0 720 480" width="720" height="480" xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans, system-ui, sans-serif">
<title>Ba bước gửi ảnh từ máy Sony sang điện thoại: chọn ảnh, ghép nối, ảnh về điện thoại</title>
<rect width="720" height="480" fill="#ffffff"/>
<text x="360" y="80" text-anchor="middle" font-size="28" font-weight="600" fill="#0b0d12">Gửi ảnh sang điện thoại</text>
<rect x="32" y="150" width="190" height="160" rx="14" fill="#f3f4f6" stroke="#0b0d12" stroke-width="3"/>
<text x="127" y="214" text-anchor="middle" font-size="28" font-weight="600" fill="#0b0d12">Chọn ảnh</text>
<text x="127" y="254" text-anchor="middle" font-size="26" font-weight="600" fill="#0b0d12">trên máy</text>
<rect x="265" y="150" width="190" height="160" rx="14" fill="#f3f4f6" stroke="#0b0d12" stroke-width="3"/>
<text x="360" y="214" text-anchor="middle" font-size="28" font-weight="600" fill="#0b0d12">Ghép nối</text>
<text x="360" y="254" text-anchor="middle" font-size="24" fill="#4a5260">QR hoặc SSID</text>
<rect x="498" y="150" width="190" height="160" rx="14" fill="#ffffff" stroke="#f05a14" stroke-width="4"/>
<text x="593" y="214" text-anchor="middle" font-size="28" font-weight="600" fill="#0b0d12">Ảnh về</text>
<text x="593" y="254" text-anchor="middle" font-size="26" font-weight="600" fill="#0b0d12">điện thoại</text>
<line x1="230" y1="230" x2="250" y2="230" stroke="#0b0d12" stroke-width="3"/>
<polygon points="250,221 262,230 250,239" fill="#0b0d12"/>
<line x1="463" y1="230" x2="483" y2="230" stroke="#0b0d12" stroke-width="3"/>
<polygon points="483,221 495,230 483,239" fill="#0b0d12"/>
<line x1="32" y1="342" x2="688" y2="342" stroke="#e3e6eb" stroke-width="2"/>
<text x="360" y="392" text-anchor="middle" font-size="24" fill="#4a5260">A7C II cần ghép nối trước bằng Smartphone Connection</text>
</svg>
