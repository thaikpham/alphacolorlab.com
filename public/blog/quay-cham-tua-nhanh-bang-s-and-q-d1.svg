<svg viewBox="0 0 720 480" width="720" height="480" xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans, system-ui, sans-serif">
<title>Tốc độ phát bằng Record Setting chia Frame Rate, 25p với 100fps chậm 4 lần</title>
<rect width="720" height="480" fill="#ffffff"/>
<text x="32" y="58" font-size="26" font-weight="600" fill="#0b0d12">Tốc độ phát = Record Setting ÷ Frame Rate</text>
<rect x="32" y="84" width="656" height="104" rx="14" fill="#ffffff" stroke="#f05a14" stroke-width="3"/>
<text x="60" y="128" font-size="26" font-weight="600" fill="#0b0d12">Frame Rate 100fps</text>
<text x="60" y="164" font-size="24" fill="#4a5260">Record Setting 25p trên ZV-E10</text>
<text x="668" y="146" font-size="28" font-weight="600" fill="#b43f00" text-anchor="end">4 lần chậm</text>
<rect x="32" y="208" width="656" height="104" rx="14" fill="#f3f4f6"/>
<text x="60" y="252" font-size="26" font-weight="600" fill="#0b0d12">Frame Rate 25fps</text>
<text x="60" y="288" font-size="24" fill="#4a5260">Record Setting 50p trên ZV-E10</text>
<text x="668" y="270" font-size="28" font-weight="600" fill="#0b0d12" text-anchor="end">2 lần nhanh</text>
<rect x="32" y="332" width="656" height="104" rx="14" fill="#f3f4f6"/>
<text x="60" y="376" font-size="26" font-weight="600" fill="#0b0d12">Frame Rate 100fps</text>
<text x="60" y="412" font-size="24" fill="#4a5260">Rec Frame Rate 100p trên A7C II</text>
<text x="668" y="394" font-size="28" font-weight="600" fill="#4a5260" text-anchor="end">Bình thường</text>
<text x="32" y="466" font-size="24" fill="#4a5260">Suy ra từ bảng tốc độ của Sony, không theo tỉ lệ thật.</text>
</svg>
