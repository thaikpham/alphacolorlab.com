<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" font-family="Noto Sans, system-ui, sans-serif">
<title>Lỗ mở của ống 50mm ở f/3.5 và f/5.6</title>
<rect width="720" height="480" fill="#ffffff"/>
<rect x="40" y="60" width="320" height="360" rx="14" fill="#f3f4f6" stroke="#7c8594" stroke-width="3"/>
<rect x="380" y="60" width="300" height="360" rx="14" fill="#f3f4f6" stroke="#7c8594" stroke-width="3"/>
<circle cx="200" cy="250" r="107" fill="#ffffff" stroke="#0b0d12" stroke-width="4"/>
<circle cx="530" cy="250" r="67" fill="#f05a14"/>
<text x="200" y="110" font-size="28" font-weight="600" text-anchor="middle" fill="#0b0d12">Giữ f/3.5 ở 50mm</text>
<text x="200" y="400" font-size="26" text-anchor="middle" fill="#4a5260">Lỗ khoảng 14 mm</text>
<text x="530" y="110" font-size="28" font-weight="600" text-anchor="middle" fill="#0b0d12">Ống kit ở 50mm</text>
<text x="530" y="400" font-size="26" text-anchor="middle" fill="#4a5260">Lỗ khoảng 9 mm</text>
</svg>
