<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" font-family="Noto Sans, system-ui, sans-serif">
<title>Ba nấc 1/3 stop từ 1/60 đến 1/125 s</title>
<rect width="720" height="480" fill="#ffffff"/>
<rect x="40" y="60" width="640" height="360" rx="14" fill="#f3f4f6" stroke="#7c8594" stroke-width="3"/>
<text x="360" y="122" font-size="28" font-weight="600" text-anchor="middle" fill="#0b0d12">Một stop, ba nấc</text>
<line x1="100" y1="150" x2="580" y2="150" stroke="#f05a14" stroke-width="4"/>
<line x1="100" y1="150" x2="100" y2="170" stroke="#f05a14" stroke-width="4"/>
<line x1="580" y1="150" x2="580" y2="170" stroke="#f05a14" stroke-width="4"/>
<line x1="100" y1="270" x2="580" y2="270" stroke="#0b0d12" stroke-width="4"/>
<circle cx="100" cy="270" r="14" fill="#ffffff" stroke="#0b0d12" stroke-width="4"/>
<circle cx="260" cy="270" r="14" fill="#ffffff" stroke="#0b0d12" stroke-width="4"/>
<circle cx="420" cy="270" r="14" fill="#ffffff" stroke="#0b0d12" stroke-width="4"/>
<circle cx="580" cy="270" r="14" fill="#ffffff" stroke="#0b0d12" stroke-width="4"/>
<text x="180" y="238" font-size="28" font-weight="600" text-anchor="middle" fill="#0b0d12">1/3</text>
<text x="340" y="238" font-size="28" font-weight="600" text-anchor="middle" fill="#0b0d12">1/3</text>
<text x="500" y="238" font-size="28" font-weight="600" text-anchor="middle" fill="#0b0d12">1/3</text>
<text x="100" y="326" font-size="26" text-anchor="middle" fill="#4a5260">1/60 s</text>
<text x="260" y="326" font-size="26" text-anchor="middle" fill="#4a5260">1/80 s</text>
<text x="420" y="326" font-size="26" text-anchor="middle" fill="#4a5260">1/100 s</text>
<text x="580" y="326" font-size="26" text-anchor="middle" fill="#4a5260">1/125 s</text>
</svg>
