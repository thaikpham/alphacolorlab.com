<rect x="56" y="124" width="296" height="312" rx="14" fill="#f3f4f6" stroke="#f05a14" stroke-width="4"/>
<rect x="368" y="124" width="296" height="312" rx="14" fill="#f3f4f6"/>
<text x="204" y="180" text-anchor="middle" font-size="28" font-weight="600" fill="#b43f00">Được dùng</text>
<text x="516" y="180" text-anchor="middle" font-size="28" font-weight="600" fill="#4a5260">Không dùng được</text>
