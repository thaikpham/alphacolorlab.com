<circle cx="600" cy="330" r="12" fill="#f05a14"/>
<line x1="300" y1="390" x2="600" y2="390" stroke="#7c8594" stroke-width="2"/>
<line x1="300" y1="390" x2="300" y2="400" stroke="#7c8594" stroke-width="2"/>
