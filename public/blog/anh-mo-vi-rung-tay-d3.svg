<text x="300" y="430" text-anchor="middle" font-size="26" fill="#4a5260">1/30</text>
<text x="400" y="430" text-anchor="middle" font-size="26" fill="#4a5260">1/125</text>
<text x="500" y="430" text-anchor="middle" font-size="26" fill="#4a5260">1/500</text>
