<svg viewBox="0 0 720 480" width="720" height="480" xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans, system-ui, sans-serif">
<title>Anti-flicker Shoot. chỉ ảnh tĩnh, Var. Shutter dùng cho video</title>
<rect width="720" height="480" fill="#ffffff"/>
<rect x="32" y="40" width="656" height="180" rx="14" fill="#f3f4f6"/>
<text x="60" y="96" font-size="28" font-weight="600" fill="#0b0d12">Anti-flicker Shoot.</text>
<text x="668" y="96" font-size="24" fill="#4a5260" text-anchor="end">Không dùng cho video</text>
<text x="60" y="140" font-size="24" fill="#4a5260">Chỉ ảnh tĩnh, màn trập cơ</text>
<text x="60" y="182" font-size="24" fill="#4a5260">Dò đèn 100 Hz, 120 Hz</text>
<rect x="32" y="260" width="656" height="180" rx="14" fill="#ffffff" stroke="#f05a14" stroke-width="3"/>
<text x="60" y="316" font-size="28" font-weight="600" fill="#0b0d12">Var. Shutter</text>
<text x="668" y="316" font-size="24" font-weight="600" fill="#b43f00" text-anchor="end">Dùng cho video</text>
<text x="60" y="360" font-size="24" fill="#4a5260">Ảnh tĩnh và video</text>
<text x="60" y="402" font-size="24" fill="#4a5260">Dò thêm đèn LED</text>
</svg>
